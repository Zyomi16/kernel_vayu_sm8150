name: build

on:
  push:
    branches: [main, config/yomi16]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # LLVM=1: Makefile:391-399 picks clang/ld.lld/llvm-* instead of $(CROSS_COMPILE)gcc
      # CROSS_COMPILE drives CLANG_TRIPLE + --gcc-toolchain (Makefile:521-534)
      MAKE_ARGS: O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
      # Runner ubuntu-22.04 = 2 core / 7 GB → $(nproc) ra 2.
      # KHONG dung "ubuntu-22.04-4core": label do khong ton tai trong tai khoan
      # nay, job se treo vo han cho runner khop label (run 37077911639 queued
      # >30 phut, runner_id=0). Muon nhieu core thi phai mua larger runner.
      MAKE_JOBS: 2

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-11 lld-11 llvm-11 gcc-11-aarch64-linux-gnu bc bison flex zstd liblz4-tool
          sudo ln -sf /usr/bin/elfedit /usr/bin/aarch64-linux-gnu-elfedit

      - name: Build Image.gz-dtb
        run: |
          export PATH=/usr/lib/llvm-11/bin:$PATH
          clang --version | head -1
          make -j"$MAKE_JOBS" $MAKE_ARGS vayu_defconfig
          # Merge yomi16.config (DroidSpaces + LTO) VAO SAU defconfig.
          # -m = chi merge, khong chay make; -O out = thu muc output.
          # Phai merge sau defconfig vi make <target>_defconfig tao lai .config
          # tu defconfig va se xoa het thay doi khong nam trong defconfig.
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/yomi16.config
          # olddefconfig (khong phai alldefconfig) de giu nguyen config da chon
          make -j"$MAKE_JOBS" $MAKE_ARGS olddefconfig
          # Xac nhan 7 config can co that su len .config truoc khi build
          for c in CONFIG_IPC_NS CONFIG_IP_SET CONFIG_IP_SET_HASH_IP \
                   CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET \
                   CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_NF_CT_NETLINK; do
            grep -qx "$c=y" out/.config || { echo "FAIL: $c khong = y"; exit 1; }
          done
          echo "OK: 7/7 config da len .config"
          make -j"$MAKE_JOBS" $MAKE_ARGS Image.gz-dtb

      - uses: actions/upload-artifact@v4
        with:
          name: yomi16-out
          # upload-artifact@v4 bo qua file dot (mac dinh include-hidden-files=false),
          # nen out/.config se bi bo qua neu khong bat co.
          include-hidden-files: true
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/qcom/*.dtb
            out/arch/arm64/boot/dts/qcom/*.dtbo
            out/.config
            out/System.map