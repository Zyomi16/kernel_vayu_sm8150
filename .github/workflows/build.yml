name: build

on:
  push:
    branches: [main, config/yomi16]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # LLVM=1: Makefile:391-399 picks clang/ld.lld/llvm-* instead of $(CROSS_COMPILE)gcc
      # CROSS_COMPILE drives CLANG_TRIPLE + --gcc-toolchain (Makefile:521-534)
      MAKE_ARGS: O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
      # Runner ubuntu-22.04 = 2 core / 7 GB → $(nproc) ra 2.
      # KHONG dung "ubuntu-22.04-4core": label do khong ton tai trong tai khoan
      # nay, job se treo vo han cho runner khop label (run 37077911639 queued
      # >30 phut, runner_id=0). Muon nhieu core thi phai mua larger runner.
      MAKE_JOBS: 2
      # ld-name=lld: Makefile:707 kiem tra `ifneq ($(ld-name),lld)` de BO QUA
      # vie gan LD := $(LDGOLD). Cay nay khong gan ld-name o dau (grep: 0 cho),
      # nen ifneq luon dung → LD := $(LDGOLD). Ma voi LLVM=1 thi LDGOLD
      # RONG (Makefile:391-399 khong dinh nghia LDGOLD) → LD rong, rồi
      # arch/arm64/Makefile:103 cong them -EL → lenh link bi "-EL -plugin ...".
      # ld-name=lld lam cho nhanh ifneq that, giu LD = ld.lld.
      # Xac nhan bang run 37084024479 (probe in ra LD rong).
      EXTRA_MAKE_ARGS: ld-name=lld

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-11 lld-11 llvm-11 gcc-11-aarch64-linux-gnu bc bison flex zstd liblz4-tool zip
          sudo ln -sf /usr/bin/elfedit /usr/bin/aarch64-linux-gnu-elfedit

      - name: Build Image.gz-dtb
        run: |
          export PATH=/usr/lib/llvm-11/bin:$PATH
          clang --version | head -1
          make -j"$MAKE_JOBS" $MAKE_ARGS vayu_defconfig
          # Merge yomi16.config (DroidSpaces + LTO) VAO SAU defconfig.
          # -m = chi merge, khong chay make; -O out = thu muc output.
          # Phai merge sau defconfig vi make <target>_defconfig tao lai .config
          # tu defconfig va se xoa het thay doi khong nam trong defconfig.
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/yomi16.config
          # olddefconfig (khong phai alldefconfig) de giu nguyen config da chon
          make -j"$MAKE_JOBS" $MAKE_ARGS olddefconfig
          # Xac nhan 9 config can co that su len .config truoc khi build
          for c in CONFIG_IPC_NS CONFIG_IP_SET CONFIG_IP_SET_HASH_IP \
                   CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET \
                   CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_NF_CT_NETLINK \
                   CONFIG_LTO_CLANG CONFIG_THINLTO; do
            grep -qx "$c=y" out/.config || { echo "FAIL: $c khong = y"; exit 1; }
          done
          echo "OK: 9/9 config da len .config"

          make -j"$MAKE_JOBS" $MAKE_ARGS $EXTRA_MAKE_ARGS Image.gz-dtb

      - name: Package flashable zip
        run: |
          set -e
          AK=anykernel
          # dtbo.img: cay nay khong co target sinh san (cmd_mkdtimg o
          # scripts/Makefile.lib:345 khong duoc target nao goi), nen goi
          # script AOSP trong cay truc tiep. Cai nay build ca 13 .dtbo cua
          # tat ca board trong out/, giong cach zip cua dev.
          python3 scripts/dtc/libfdt/mkdtboimg.py create "$AK/dtbo.img" \
            --page_size=4096 out/arch/arm64/boot/dts/qcom/*.dtbo
          # dtb: ak3-core.sh:352 xu ly `for fdt in dt recovery_dtbo dtb`
          # va :431 dung `magiskboot dtb $fdt patch` → dtb PHAI LA FILE,
          # khong phai thu muc. File dat ten theo board.
          cp out/arch/arm64/boot/dts/qcom/sm8150-v2-xiaomi.dtb "$AK/dtb"
          cp out/arch/arm64/boot/Image "$AK/Image"
          # DTB khong append vao Image (non-GKI) → tach rieng nhu zip cua dev.
          test -s "$AK/Image" || { echo "FAIL: Image rong"; exit 1; }
          test -s "$AK/dtbo.img" || { echo "FAIL: dtbo.img rong"; exit 1; }
          # banner + README
          printf '#Yomi16\n' > "$AK/banner"
          printf 'Yomi16 for POCO F5 (vayu)\nKernel: 4.14.357+17-Yomi16\nBuilt with clang-11, LLVM=1, LTO+ThinLTO\n' \
            > "$AK/README.md"
          # Zip: -x '.*' loai .gitkeep/DS_Store; -r giữ quyen exec cho tools
          ZIP="Yomi16_vayu_$(date -u +%Y%m%d).zip"
          (cd "$AK" && zip -r9 "../../$ZIP" . -x '.*')
          cd ../..
          ls -la "$ZIP"
          echo "DONE: $ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: Yomi16-flashable
          path: Yomi16_vayu_*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: yomi16-out
          # upload-artifact@v4 bo qua file dot (mac dinh include-hidden-files=false),
          # nen out/.config se bi bo qua neu khong bat co.
          include-hidden-files: true
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/qcom/*.dtb
            out/arch/arm64/boot/dts/qcom/*.dtbo
            out/.config
            out/System.map